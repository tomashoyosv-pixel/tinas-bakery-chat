<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Tina's Bakery Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: three stations side by side — the client's phone, the bakery's phone (agent), and the internal order software. One station at a time on phones. */
:root{
  color-scheme: light;
  --ink:#3b2418; --ink-2:#6b4a35; --ink-3:#9a7b66;
  --brown:#5a3722; --brown-2:#7a4e31; --caramel:#c98a4b; --caramel-soft:#f3dcc0;
  --cream:#f4eadc; --paper:#fffaf4; --page:#e9dccb; --line:#e2d0bb; --white:#ffffff;
  --ok:#3d7f55; --ok-bg:#e1f0e5; --warn:#9a5f08; --warn-bg:#fbecd2; --bad:#a63c33; --bad-bg:#f6dedb;
  --info:#3a6690; --info-bg:#dde8f3; --prep:#74489a; --prep-bg:#ece2f4; --ready:#1f6f6f; --ready-bg:#d8efee;
  --read:#3b8fd6;
  --f-display:"Baloo 2","Quicksand",system-ui,sans-serif;
  --f-body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
input,select,textarea{font-family:inherit;color:var(--ink)}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;max-width:1440px;margin:0 auto 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;background:var(--brown);color:var(--caramel-soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;margin:0;color:var(--brown);text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--ink-2);font-weight:500}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{background:var(--white)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:var(--paper)}
.btn.primary:hover{background:var(--brown-2)}

.tabs{display:none;max-width:520px;margin:0 auto 14px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font-weight:700;font-size:13px;color:var(--ink-2);position:relative}
.tabs button[aria-selected="true"]{background:var(--brown);color:var(--paper)}
.tabs .dot{position:absolute;top:4px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--caramel);color:var(--white);font-size:11px;display:grid;place-items:center;padding:0 5px}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:350px 350px minmax(0,1fr);gap:22px;max-width:1440px;margin:0 auto;align-items:start}
.station{display:flex;flex-direction:column;gap:8px;min-width:0}
.station-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.station-label b{font-family:var(--f-display);font-size:17px;color:var(--brown);font-weight:600}
.station-label span{font-size:12px;color:var(--ink-2);font-weight:600}

/* ---------- phone ---------- */
.phone{width:100%;max-width:350px;height:690px;background:#2a1a11;border-radius:38px;padding:10px;box-shadow:0 18px 40px -18px rgba(59,36,24,.55);position:relative}
.screen{background:var(--cream);height:100%;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;color:var(--paper);background:var(--brown)}
.statusbar .notch{width:90px;height:20px;background:#2a1a11;border-radius:0 0 14px 14px;margin-top:-8px}
.view{flex:1;display:flex;flex-direction:column;min-height:0}

.app-head{background:var(--brown);color:var(--paper);padding:10px 14px 12px;display:flex;align-items:center;gap:10px;flex:none}
.app-head h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;flex:1;line-height:1.1}
.app-head .sub{font-size:11px;opacity:.85;font-weight:600}
.icon-btn{background:none;border:0;color:inherit;padding:4px;display:grid;place-items:center;border-radius:50%}
.icon-btn svg{width:20px;height:20px}
.searchbar{margin:8px 10px;background:var(--paper);border-radius:999px;padding:7px 12px;color:var(--ink-3);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center;flex:none}
.searchbar svg{width:14px;height:14px}
.filters{display:flex;gap:6px;padding:0 10px 6px;flex:none}
.filters span{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2)}
.filters span.on{background:var(--caramel-soft);color:var(--brown)}

.chatlist{flex:1;overflow-y:auto;background:var(--paper)}
.chat-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid #f0e4d6}
.chat-item:hover{background:#fbf3e9}
.chat-item.locked{opacity:.62}
.chat-item.featured{background:#fbf1e3}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:var(--white);font-size:16px}
.avatar.tb{background:var(--brown);font-family:var(--f-display);color:var(--caramel-soft)}
.ci-body{flex:1;min-width:0}
.ci-row{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.ci-name{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:11px;color:var(--ink-3);font-weight:600;flex:none}
.ci-time.new{color:var(--caramel)}
.ci-prev{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--caramel);color:var(--white);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px;flex:none}
.pin{font-size:10px;font-weight:700;color:var(--caramel);text-transform:uppercase;letter-spacing:.06em}

/* chat */
.chat-head{background:var(--brown);color:var(--paper);display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none}
.chat-head .avatar{width:36px;height:36px;font-size:14px}
.ch-info{flex:1;min-width:0}
.ch-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-status{font-size:11.5px;opacity:.88;font-weight:600}
.agent-switch{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.12);border:0;color:var(--paper);border-radius:999px;padding:4px 8px 4px 6px}
.agent-switch i{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.35);position:relative;display:block}
.agent-switch i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--paper);transition:left .15s}
.agent-switch[aria-pressed="true"] i{background:var(--caramel)}
.agent-switch[aria-pressed="true"] i::after{left:13px}

.messages{flex:1;overflow-y:auto;padding:12px 10px 8px;display:flex;flex-direction:column;gap:4px;
  background-color:var(--cream);
  background-image:radial-gradient(rgba(122,78,49,.09) 1.2px,transparent 1.3px),radial-gradient(rgba(122,78,49,.06) 1px,transparent 1.1px);
  background-size:22px 22px,22px 22px;background-position:0 0,11px 11px}
.day-chip{align-self:center;background:var(--paper);color:var(--ink-2);font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:2px 0 6px;box-shadow:0 1px 0 rgba(59,36,24,.08)}
.sys-chip{align-self:center;background:#fbefd9;color:var(--warn);font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;text-align:center;max-width:88%;margin-bottom:6px;line-height:1.35}
.msg{display:flex;flex-direction:column;max-width:84%}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.bubble{padding:6px 9px 5px;border-radius:10px;font-size:13.5px;line-height:1.38;position:relative;box-shadow:0 1px 0 rgba(59,36,24,.1);word-wrap:break-word;overflow-wrap:anywhere}
.msg.in .bubble{background:var(--white);border-top-left-radius:3px}
.msg.out .bubble{background:var(--caramel-soft);border-top-right-radius:3px}
.bubble b{font-weight:700}
.who{font-size:11px;font-weight:700;color:var(--caramel);margin-bottom:2px}
.who.staff{color:var(--brown-2)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
.meta svg{width:16px;height:11px}
.meta .read{color:var(--read)}
.btns{display:flex;flex-direction:column;gap:4px;margin-top:4px;width:100%;min-width:200px}
.btns button{background:var(--white);border:0;border-radius:9px;padding:8px 10px;font-weight:700;font-size:13px;color:var(--brown-2);box-shadow:0 1px 0 rgba(59,36,24,.1)}
.btns button:hover:not(:disabled){background:#fff6ec}
.btns button:disabled{opacity:.5;cursor:default}
.btns.ghost button{background:rgba(255,255,255,.55);font-size:12px;padding:5px 8px;color:var(--ink-3)}
.typing .bubble{display:flex;gap:4px;padding:10px 12px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

.cat-card{width:230px;max-width:100%}
.cat-cover{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;border-radius:8px;overflow:hidden;margin-bottom:6px}
.cat-cover span{aspect-ratio:1.5;display:grid;place-items:center;font-size:26px}
.cat-meta b{display:block;font-size:13.5px}
.cat-meta small{color:var(--ink-2);font-size:12px;font-weight:600}
.cat-open{margin-top:6px;width:100%;border:0;border-top:1px solid #efe2d3;background:none;padding:8px 0 2px;font-weight:700;color:var(--caramel);font-size:13.5px}
.cat-sent{margin-top:6px;font-size:11.5px;color:var(--ink-3);font-weight:600}

.composer{display:flex;align-items:center;gap:6px;padding:6px 8px 10px;background:transparent;flex:none;background:var(--cream)}
.composer input{flex:1;min-width:0;border:0;border-radius:999px;padding:10px 14px;font-size:13.5px;background:var(--white);font-weight:500}
.composer input::placeholder{color:var(--ink-3)}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--brown);color:var(--paper);display:grid;place-items:center;flex:none}
.send svg{width:18px;height:18px}
.hint{font-size:11px;color:var(--ink-2);font-weight:600;text-align:center;padding:0 10px 2px;background:var(--cream)}

/* catalog sheet */
.sheet-wrap{position:absolute;inset:0;background:rgba(42,26,17,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--paper);width:100%;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sheet-head b{font-family:var(--f-display);font-size:18px;color:var(--brown);font-weight:600}
.sheet-body{overflow-y:auto;padding:6px 12px}
.cat-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin:10px 2px 4px}
.prod{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1e5d7}
.thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;flex:none}
.prod-info{flex:1;min-width:0}
.prod-info b{font-size:13.5px;display:block}
.prod-info p{margin:1px 0 2px;font-size:11.5px;color:var(--ink-2);line-height:1.3}
.prod-info .price{font-weight:700;color:var(--brown-2);font-size:13px;font-variant-numeric:tabular-nums}
.prod.off{opacity:.5}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--white);font-weight:700;font-size:15px;line-height:1}
.stepper output{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sheet-foot{padding:10px 12px 14px;border-top:1px solid var(--line)}
.sheet-foot .btn{width:100%;padding:11px;font-size:14px}
.sheet-foot .btn:disabled{opacity:.45;cursor:default}

.toast-in{position:absolute;left:12px;right:12px;bottom:70px;background:var(--ink);color:var(--paper);padding:9px 12px;border-radius:10px;font-size:12px;font-weight:600;text-align:center;z-index:6;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ---------- admin panel ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:690px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--white)}
.p-head .ttl{display:flex;align-items:center;gap:10px}
.p-head .ttl b{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--brown)}
.p-head .ttl small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600}
.p-nav{display:flex;gap:4px;flex-wrap:wrap}
.p-nav button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2)}
.p-nav button[aria-selected="true"]{background:var(--caramel-soft);color:var(--brown)}
.p-body{padding:16px 18px;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}

.login{flex:1;display:grid;place-items:center;padding:30px 18px}
.login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.login h3{font-family:var(--f-display);font-size:24px;color:var(--brown);margin:0;font-weight:600;text-align:center}
.login p{margin:0;text-align:center;color:var(--ink-2);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;background:var(--white);font-weight:500}
.login .note{font-size:11.5px;background:var(--cream);border-radius:8px;padding:8px 10px;color:var(--ink-2);text-align:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.stat{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-size:24px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.stat[aria-pressed="true"]{border-color:var(--brown);box-shadow:inset 0 0 0 1px var(--brown)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--white);font-size:13.5px;font-weight:500}
.count{font-size:12px;color:var(--ink-2);font-weight:600}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--white)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fcf6ee;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f2e8dc;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fdf7f0}
tbody tr:last-child td{border-bottom:0}
tr.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%,40%{background:#fbe7c9}100%{background:transparent}}
.code{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex{display:inline-block;font-size:10px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.newtag{display:inline-block;font-size:10px;font-weight:700;color:var(--white);background:var(--caramel);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.muted{color:var(--ink-2);font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pend{color:var(--warn);background:var(--warn-bg)}
.s-conf{color:var(--info);background:var(--info-bg)}
.s-prep{color:var(--prep);background:var(--prep-bg)}
.s-ready{color:var(--ready);background:var(--ready-bg)}
.s-done{color:var(--ok);background:var(--ok-bg)}
.s-rej{color:var(--bad);background:var(--bad-bg)}
.pay-ok{color:var(--ok);font-weight:700;font-size:12px}
.pay-pend{color:var(--warn);font-weight:700;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--ink-2)}

/* production */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.day h4{margin:0;font-family:var(--f-display);font-size:17px;color:var(--brown);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day h4 small{font-family:var(--f-body);font-size:11.5px;color:var(--ink-2);font-weight:700}
.units{display:flex;flex-direction:column;gap:4px;background:var(--cream);border-radius:10px;padding:8px 10px}
.units div{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.units div b{font-variant-numeric:tabular-nums}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.day li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:center;cursor:pointer}
.day li:hover .lname{text-decoration:underline}
.section-note{margin:0;color:var(--ink-2);font-size:13px}

/* catalog admin */
.cat-admin{display:flex;flex-direction:column;gap:10px}
.cat-row{display:grid;grid-template-columns:52px minmax(0,1fr) 130px 120px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--white)}
.cat-row .fields{display:flex;flex-direction:column;gap:4px;min-width:0}
.cat-row .fields b{font-size:14px}
.cat-row .fields small{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cat-row textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;resize:vertical;min-height:38px;background:var(--paper)}
.cat-row input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13.5px;font-weight:700;background:var(--paper)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;border:0;background:none;padding:0}
.toggle i{width:34px;height:20px;border-radius:10px;background:#d8c7b4;position:relative;display:block;flex:none}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--white);transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--ok)}
.toggle[aria-pressed="true"] i::after{left:17px}

/* detail drawer */
.drawer-wrap{position:absolute;inset:0;background:rgba(42,26,17,.35);display:flex;justify-content:flex-end;z-index:5}
.drawer{width:min(440px,100%);height:100%;background:var(--paper);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:-10px 0 30px -12px rgba(42,26,17,.4)}
.drawer h3{margin:0;font-family:var(--f-display);font-size:22px;color:var(--brown);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:13px;margin:0}
.dl dt{color:var(--ink-2);font-weight:700;font-size:12px}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:12px}
.box h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.items-t{width:100%;min-width:0;font-size:13px}
.items-t td{padding:4px 0;border:0;cursor:default}
.items-t tr{cursor:default}
.items-t tr:hover{background:none}
.items-t .r{text-align:right;font-variant-numeric:tabular-nums}
.items-t tfoot td{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.p-toast{position:absolute;top:66px;right:16px;background:var(--brown);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px;z-index:7;box-shadow:0 10px 24px -10px rgba(42,26,17,.6);animation:fade .25s;max-width:calc(100% - 32px)}

/* ---------- responsive ---------- */
@media (max-width:1380px){
  .stage{grid-template-columns:repeat(2,minmax(0,350px));justify-content:center}
  .station.admin{grid-column:1 / -1}
}
@media (max-width:780px){
  .tabs{display:flex}
  .stage{grid-template-columns:minmax(0,1fr)}
  .station{display:none}
  .station.active{display:flex}
  .station.admin{grid-column:auto}
  .phone{margin:0 auto;height:min(690px,calc(100vh - 150px));min-height:540px}
  .station-label{justify-content:center}
  .cat-row{grid-template-columns:44px minmax(0,1fr);}
  .cat-row .price-cell,.cat-row .avail-cell{grid-column:2}
  .dl{grid-template-columns:100px minmax(0,1fr)}
  .brand h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">TB</div>
    <div>
      <h1>Tina's Bakery · Pedidos por chat</h1>
      <p>Simulación: el cliente escribe, el agente atiende y el pedido llega al panel interno.</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn" id="btn-demo" type="button">▶ Ver demo automática</button>
    <button class="btn danger" id="btn-reset" type="button">Reiniciar simulación</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Pantallas">
  <button role="tab" data-tab="client" aria-selected="true">Cliente<span class="dot" id="dot-client" hidden></span></button>
  <button role="tab" data-tab="biz" aria-selected="false">Tina's Bakery<span class="dot" id="dot-biz" hidden></span></button>
  <button role="tab" data-tab="admin" aria-selected="false">Panel<span class="dot" id="dot-admin" hidden></span></button>
</nav>

<main class="stage">
  <section class="station client active" data-station="client">
    <div class="station-label"><b>Celular del cliente</b><span>+57 300 555 0142</span></div>
    <div class="phone"><div class="screen" id="ph-client"></div></div>
  </section>
  <section class="station biz" data-station="biz">
    <div class="station-label"><b>Celular de Tina's Bakery</b><span>Aquí vive el agente</span></div>
    <div class="phone"><div class="screen" id="ph-biz"></div></div>
  </section>
  <section class="station admin" data-station="admin">
    <div class="station-label"><b>Software interno de pedidos</b><span>Solo Martina y Sara</span></div>
    <div class="panel" id="panel"></div>
  </section>
</main>

<script>
(function(){
"use strict";
/* ================= data ================= */
const CLIENT_PHONE = '+57 300 555 0142';
const KEY = 'tinas-chat-sim-v1';
const STATUSES = ['Pendiente de revisión','Confirmado','En preparación','Listo para entregar','Entregado','Rechazado o cancelado'];
const SCLS = {'Pendiente de revisión':'s-pend','Confirmado':'s-conf','En preparación':'s-prep','Listo para entregar':'s-ready','Entregado':'s-done','Rechazado o cancelado':'s-rej'};
const DEFAULT_CATALOG = [
  {id:'torta',  name:'Torta Choco Crunch', cat:'Tortas',          desc:'Bizcocho de chocolate, ganache y crocante de chocolate. 12 porciones.', price:95000,  avail:true, emoji:'🍫', hue:'#e9d2bd'},
  {id:'alfajor',name:'Alfajores de Milo',  cat:'Alfajores',       desc:'Caja de 6 alfajores rellenos de arequipe y cubiertos de Milo.',          price:30000,  avail:true, emoji:'🍪', hue:'#f3dfc4'},
  {id:'kit',    name:'Kit Celebración',    cat:'Kits especiales', desc:'Mini torta Choco Crunch + 6 alfajores + tarjeta personalizada.',          price:120000, avail:true, emoji:'🎁', hue:'#f4d6cf'},
  {id:'navidad',name:'Kit Navidad',        cat:'Temporada',       desc:'Edición navideña: galletas decoradas + 4 alfajores en caja de regalo.',   price:85000,  avail:true, emoji:'🎄', hue:'#d7e8d6'}
];
const KW = {navidad:/navid|temporada/, kit:/\bkits?\b|combo|celebra/, alfajor:/alfaj|milo/, torta:/torta|choco|crunch|pastel|cake|ponque/};
const NUMW = [['media docena',6],['docena',12],['un',1],['una',1],['uno',1],['dos',2],['tres',3],['cuatro',4],['cinco',5],['seis',6],['siete',7],['ocho',8],['nueve',9],['diez',10]];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ================= helpers ================= */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich = s => esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const money = n => '$' + Math.round(n).toLocaleString('es-CO');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const hhmm = (d=new Date()) => d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit',hour12:true}).replace(/\s?a\.?\s?m\.?/i,' a. m.').replace(/\s?p\.?\s?m\.?/i,' p. m.');
const today0 = ()=>{const d=new Date(); d.setHours(0,0,0,0); return d;};
const addDays = n => {const d=today0(); d.setDate(d.getDate()+n); return d;};
const toISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromISO = s => {const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
const prettyDate = iso => { if(!iso) return '—'; const d=fromISO(iso); return DAYS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); };
const longDate = iso => { const d=fromISO(iso); return DAYS[d.getDay()]+' '+d.getDate()+' de '+MONTHS[d.getMonth()]; };
const cap = s => s.split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');
const prod = id => S.catalog.find(p=>p.id===id);

/* ================= state ================= */
let S;
function freshState(){
  const catalog = JSON.parse(JSON.stringify(DEFAULT_CATALOG));
  const st = {catalog, orders:[], seq:4, conv:[], flow:{step:'idle', draft:newDraft()}, agentOn:true, activeBtn:null,
    clientView:'list', bizView:'list', unreadBiz:0, unreadClient:0, unreadAdmin:0, clientName:null, logged:false, ptab:'orders', filter:'all', search:'', lastOrder:null, freshCode:null};
  st.orders = seedOrders(catalog);
  return st;
}
function newDraft(){ return {items:{}, mode:null, address:'', date:null, dateText:'', time:'', name:'', pay:'', notes:'', auth:false, bday:'', bdayMD:null, promo:false}; }
function seedOrders(cat){
  const it = (id,qty)=>{const p=cat.find(x=>x.id===id); return {id, name:p.name, cat:p.cat, qty, price:p.price};};
  const mk = (o)=>{ o.total=o.items.reduce((a,b)=>a+b.qty*b.price,0); o.example=true; o.source='seed'; return o; };
  const created = n => {const d=addDays(n); d.setHours(10+Math.abs(n),15); return d.toISOString();};
  return [
    mk({code:'TB-0001', created:created(-4), name:'Valentina Ríos', phone:'+57 301 442 1180', items:[it('torta',1),it('alfajor',2)], date:toISO(addDays(-1)), time:'3–6 p. m.', mode:'Domicilio', address:'Cra 70 #44-21, Laureles', notes:'Escribir "Feliz cumple Pao" en la torta', bday:'12 de abril', bdayMD:[4,12], promo:true, auth:true, pay:'Nequi', payStatus:'Pagado', status:'Entregado'}),
    mk({code:'TB-0002', created:created(-2), name:'Camilo Restrepo', phone:'+57 315 208 7731', items:[it('kit',1)], date:toISO(addDays(1)), time:'9–12 a. m.', mode:'Recogida', address:'', notes:'', bday:'3 de diciembre', bdayMD:[12,3], promo:true, auth:true, pay:'Transferencia Bancolombia', payStatus:'Pagado', status:'En preparación'}),
    mk({code:'TB-0003', created:created(-1), name:'Daniela Mejía', phone:'+57 320 611 0094', items:[it('alfajor',4)], date:toISO(addDays(2)), time:'12–3 p. m.', mode:'Domicilio', address:'Calle 10 #32-15, El Poblado', notes:'Son para regalo, sin tarjeta', bday:'', bdayMD:null, promo:false, auth:true, pay:'Daviplata', payStatus:'Pendiente', status:'Confirmado'}),
    mk({code:'TB-0004', created:created(0), name:'Juliana Ortiz', phone:'+57 304 925 3318', items:[it('navidad',2),it('torta',1)], date:toISO(addDays(3)), time:'3–6 p. m.', mode:'Domicilio', address:'Av. Nutibara #71-40, Belén', notes:'Llamar al llegar', bday:'8 de diciembre', bdayMD:[12,8], promo:true, auth:true, pay:'Efectivo contra entrega', payStatus:'Pendiente', status:'Pendiente de revisión'})
  ];
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); if(s && s.catalog && s.orders) return Object.assign(freshState(), s); } }catch(e){}
  return freshState();
}
function save(){ try{ const c=Object.assign({},S); delete c.typing; localStorage.setItem(KEY, JSON.stringify(c)); }catch(e){} }
S = load();
S.typing = false;

/* ================= icons ================= */
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.2 1l1.7 6.1 9 1.3-9 1.3-1.7 6.1c-.2.7.5 1.3 1.2 1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ticks:(read)=>`<svg class="${read?'read':''}" viewBox="0 0 18 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7"/><path d="M7.5 8.5l.5.5 6-7"/></svg>`
};

/* ================= phones ================= */
const CLIENT_CHATS = [
  {n:'Mamá ❤️', p:'¿Vienes a almorzar el domingo?', t:'10:42 a. m.', c:'#b0763f', u:1},
  {n:'Familia Gómez 🏡', p:'Tía Rosa: 📷 Foto', t:'9:15 a. m.', c:'#7a8f5a'},
  {n:'Andrés U.', p:'Listo, nos vemos a las 7', t:'Ayer', c:'#5e7aa0'},
  {n:'Equipo de trabajo', p:'Laura: subí el informe al drive', t:'Ayer', c:'#9a6a8a', u:3},
  {n:'Sofi', p:'jajaja sí, total 😂', t:'Martes', c:'#c0705a'},
  {n:'Gimnasio Fit', p:'Tu plan vence el 30 de noviembre', t:'Lunes', c:'#5a8f8a'}
];
const BIZ_OTHERS = [
  {n:'Valentina Ríos', p:'¡Gracias! Estaba deliciosa 😍', t:'Ayer', c:'#b0763f'},
  {n:'Camilo Restrepo', p:'Perfecto, paso a recogerlo mañana', t:'Ayer', c:'#5e7aa0'},
  {n:'Daniela Mejía', p:'Martina: Te confirmamos para el ...', t:'Miércoles', c:'#9a6a8a'},
  {n:'Juliana Ortiz', p:'🤖 Tu solicitud fue recibida ✨', t:'Hoy', c:'#7a8f5a'}
];

function buildPhone(el, who){
  el.innerHTML = `
    <div class="statusbar"><span class="clock">${hhmm().replace(/\s?[ap]\. m\./,'')}</span><span class="notch"></span><span>5G ▮▮▮</span></div>
    <div class="view v-list"></div>
    <div class="view v-chat" hidden>
      <div class="chat-head">
        <button class="icon-btn back" type="button" aria-label="Volver a chats">${I.back}</button>
        <div class="avatar ${who==='client'?'tb':''}" ${who==='biz'?'style="background:#c98a4b"':''}>${who==='client'?'TB':'C'}</div>
        <div class="ch-info"><div class="ch-name"></div><div class="ch-status"></div></div>
        ${who==='biz'?`<button class="agent-switch" type="button" aria-pressed="true" title="Encender o apagar el agente">Agente IA <i></i></button>`:`<button class="icon-btn" type="button" aria-label="Más opciones">${I.dots}</button>`}
      </div>
      <div class="messages" aria-live="polite"></div>
      ${who==='biz'?'<div class="hint"></div>':''}
      <form class="composer" autocomplete="off">
        <input id="input-${who}" type="text" placeholder="${who==='client'?'Escribe un mensaje':'Responder como Martina'}" aria-label="Mensaje">
        <button class="send" type="submit" aria-label="Enviar">${I.send}</button>
      </form>
    </div>`;
  const P = {el, who, list:$('.v-list',el), chat:$('.v-chat',el), msgs:$('.messages',el), name:$('.ch-name',el), status:$('.ch-status',el), input:$('input',el), hint:$('.hint',el), sw:$('.agent-switch',el)};
  $('.back',el).addEventListener('click',()=>{ setView(who,'list'); });
  $('.composer',el).addEventListener('submit',e=>{ e.preventDefault(); const v=P.input.value.trim(); if(!v) return; P.input.value=''; who==='client'?clientSend(v):staffSend(v); });
  if(P.sw) P.sw.addEventListener('click',()=>{ S.agentOn=!S.agentOn; save(); renderAll(); toastIn('biz', S.agentOn?'🤖 Agente encendido: responde automáticamente':'Agente apagado: responden Martina o Sara'); });
  P.msgs.addEventListener('click',e=>{
    const b=e.target.closest('[data-reply]'); if(b && !b.disabled && who==='client'){ clientSend(b.getAttribute('data-reply')); return; }
    if(e.target.closest('[data-open-cat]')) openSheet();
  });
  P.list.addEventListener('click',e=>{
    const it=e.target.closest('.chat-item'); if(!it) return;
    if(it.dataset.main) setView(who,'chat');
    else toastIn(who,'En esta simulación solo se puede abrir el chat de '+(who==='client'?"Tina's Bakery":'este cliente'));
  });
  return P;
}
const PH = { client: buildPhone($('#ph-client'),'client'), biz: buildPhone($('#ph-biz'),'biz') };
setInterval(()=>{ document.querySelectorAll('.clock').forEach(c=>c.textContent=hhmm().replace(/\s?[ap]\. m\./,'')); },15000);

function setView(who, v){
  S[who+'View']=v;
  if(v==='chat'){ if(who==='client') S.unreadClient=0; else S.unreadBiz=0; }
  save(); renderAll();
  if(v==='chat') setTimeout(()=>PH[who].input.focus({preventScroll:true}),50);
}
function toastIn(who,msg){
  const scr = PH[who].el; const old=$('.toast-in',scr); if(old) old.remove();
  const t=document.createElement('div'); t.className='toast-in'; t.textContent=msg; scr.appendChild(t);
  setTimeout(()=>t.remove(),2400);
}

function lastMsg(){ return S.conv[S.conv.length-1]; }
function previewOf(m, who){
  if(!m) return who==='client'?'Toca para escribirnos 🍰':'Sin mensajes todavía';
  const pre = m.type==='catalog' ? '📖 Catálogo' : (m.text||'').replace(/\*/g,'').split('\n')[0];
  if(who==='client') return (m.from==='client'?'Tú: ':'')+pre;
  return (m.from==='agent'?'🤖 ':m.from==='staff'?(m.staff||'Martina')+': ':'')+pre;
}
function renderList(who){
  const P=PH[who]; const lm=lastMsg();
  const unread = who==='client'?S.unreadClient:S.unreadBiz;
  const mainName = who==='client' ? "Tina's Bakery" : (S.clientName || CLIENT_PHONE);
  const main = `<button class="chat-item featured" data-main="1" type="button">
      <div class="avatar ${who==='client'?'tb':''}" ${who==='biz'?'style="background:#c98a4b"':''}>${who==='client'?'TB':esc((S.clientName||'C')[0])}</div>
      <div class="ci-body"><div class="ci-row"><span class="ci-name">${esc(mainName)}${who==='client'?' ✔':''}</span><span class="ci-time ${unread?'new':''}">${lm?esc(lm.time):''}</span></div>
      <div class="ci-row"><span class="ci-prev">${esc(previewOf(lm,who))}</span>${unread?`<span class="badge">${unread}</span>`:(who==='client'?'<span class="pin">fijado</span>':(lm?'':'<span class="pin">nuevo</span>'))}</div></div></button>`;
  const others = (who==='client'?CLIENT_CHATS:BIZ_OTHERS).map(c=>`<button class="chat-item locked" type="button" aria-disabled="true">
      <div class="avatar" style="background:${c.c}">${esc(c.n.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ]/g,'')[0]||'?')}</div>
      <div class="ci-body"><div class="ci-row"><span class="ci-name">${esc(c.n)}</span><span class="ci-time">${esc(c.t)}</span></div>
      <div class="ci-row"><span class="ci-prev">${esc(c.p)}</span>${c.u?`<span class="badge" style="background:#b9a491">${c.u}</span>`:''}</div></div></button>`).join('');
  P.list.innerHTML = `
    <div class="app-head"><h2>${who==='client'?'Chats':"Tina's Bakery"}${who==='biz'?'<div class="sub">Cuenta de empresa · agente '+(S.agentOn?'activo 🤖':'apagado')+'</div>':''}</h2>
      <button class="icon-btn" type="button" aria-label="Buscar">${I.search}</button><button class="icon-btn" type="button" aria-label="Más opciones">${I.dots}</button></div>
    <div class="searchbar">${I.search} Buscar</div>
    <div class="filters"><span class="on">Todos</span><span>No leídos</span><span>${who==='client'?'Favoritos':'Clientes'}</span><span>Grupos</span></div>
    <div class="chatlist">${main}${others}</div>`;
}
function msgHTML(m, view){
  const mine = view==='client' ? m.from==='client' : m.from!=='client';
  const side = mine?'out':'in';
  let who='';
  if(view==='biz' && mine) who = `<div class="who">${m.from==='agent'?'🤖 Agente IA':'👩 '+esc(m.staff||'Martina')}</div>`;
  if(view==='client' && m.from==='staff') who = `<div class="who staff">${esc(m.staff||'Martina')} · Tina's Bakery</div>`;
  let body;
  if(m.type==='catalog'){
    const av=S.catalog.filter(p=>p.avail);
    body = `<div class="cat-card"><div class="cat-cover">${av.slice(0,4).map(p=>`<span style="background:${p.hue}">${p.emoji}</span>`).join('')}</div>
      <div class="cat-meta"><b>Catálogo Tina's Bakery 🍰</b><small>${av.length} productos · desde ${money(Math.min(...av.map(p=>p.price)))}</small></div>
      ${view==='client'?'<button class="cat-open" type="button" data-open-cat>Ver catálogo</button>':'<div class="cat-sent">📖 Catálogo enviado al cliente</div>'}</div>`;
  } else body = `<div class="txt">${rich(m.text)}</div>`;
  const ticks = mine ? I.ticks(m.read) : '';
  let btns='';
  if(m.buttons && m.buttons.length){
    if(view==='client'){ const act=S.activeBtn===m.id; btns=`<div class="btns">${m.buttons.map(b=>`<button type="button" ${act?'':'disabled'} data-reply="${esc(b)}">${esc(b)}</button>`).join('')}</div>`; }
    else btns=`<div class="btns ghost">${m.buttons.map(b=>`<button type="button" disabled>${esc(b)}</button>`).join('')}</div>`;
  }
  return `<div class="msg ${side}"><div class="bubble">${who}${body}<span class="meta">${esc(m.time)}${ticks}</span></div>${btns}</div>`;
}
function renderChat(who){
  const P=PH[who];
  P.name.textContent = who==='client' ? "Tina's Bakery" : (S.clientName ? S.clientName+' · '+CLIENT_PHONE : CLIENT_PHONE);
  P.status.textContent = S.typing ? (who==='client'?'escribiendo…':'🤖 el agente está escribiendo…') : (who==='client'?'Cuenta de empresa · en línea':'Cliente · en línea');
  let html = '<div class="day-chip">Hoy</div>';
  if(who==='client') html += '<div class="sys-chip">🔒 Esta es una cuenta de empresa. Te atiende el asistente virtual de Tina\'s Bakery.</div>';
  else html += '<div class="sys-chip">🤖 El agente responde de forma automática. Escribe abajo para intervenir como Martina.</div>';

    html += who==='client' ? '<div class="msg in typing"><div class="bubble"><span></span><span></span><span></span></div></div>'
                           : '<div class="msg out typing"><div class="bubble"><span></span><span></span><span></span></div></div>';
  }
  const atBottom = P.msgs.scrollHeight - P.msgs.scrollTop - P.msgs.clientHeight < 80;

  if(P.hint) P.hint.textContent = S.agentOn ? 'Agente IA activo · también puedes escribir como Martina' : 'Agente apagado · respondes tú como Martina';
}

/* ================= agent ================= */
function qtyOf(s){
  const m=s.match(/(\d+)/); if(m){ const n=parseInt(m[1],10); if(n>0 && n<100) return n; }
  for(const [w,n] of NUMW){ if(new RegExp('(^|\\s)'+w+'(\\s|$)').test(s)) return n; }
  return 1;
}
function parseItems(t){
  const segs = t.split(/,|;|\+|\n|\s(?:y|e|mas|tambien)\s/);
  const out={};
  for(const s of segs){ for(const id of ['navidad','kit','alfajor','torta']){ if(KW[id].test(s)){ out[id]=(out[id]||0)+qtyOf(s); break; } } }
  return out;
}
function parseDate(t){
  if(/pasado\s*manana/.test(t)) return addDays(2);
  if(/manana/.test(t)) return addDays(1);
  if(/\bhoy\b/.test(t)) return addDays(0);
  const dn=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  for(let i=0;i<7;i++){ if(t.includes(dn[i])){ let diff=(i-today0().getDay()+7)%7; if(diff===0) diff=7; return addDays(diff); } }
  let m=t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?/);
  if(m){ const d=+m[1], mo=+m[2]-1; let y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):today0().getFullYear(); let x=new Date(y,mo,d); if(!m[3] && x<today0()) x.setFullYear(y+1); if(x.getMonth()===mo) return x; }
  m=t.match(/(\d{1,2})\s*(?:de\s+)?([a-z]{3,})/);
  if(m){ const mi=MONTHS.findIndex(x=>m[2].startsWith(norm(x).slice(0,3))); if(mi>=0){ let x=new Date(today0().getFullYear(),mi,+m[1]); if(x<today0()) x.setFullYear(x.getFullYear()+1); return x; } }
  return null;
}
function parseBday(t){
  let m=t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
  if(m && +m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31) return {md:[+m[2],+m[1]], txt:(+m[1])+' de '+MONTHS[+m[2]-1]};
  m=t.match(/(\d{1,2})\s*(?:de\s+)?([a-z]{3,})/);
  if(m){ const mi=MONTHS.findIndex(x=>m[2].startsWith(norm(x).slice(0,3))); if(mi>=0) return {md:[mi+1,+m[1]], txt:(+m[1])+' de '+MONTHS[mi]}; }
  return null;
}
const isYes = t => /^(si|sii+|claro|dale|ok|okay|listo|acepto|autorizo|de una|por supuesto|bueno|va|yes)\b|✅|si,|si autorizo|sí/.test(t);
const isNo = t => /^(no|nop|nel|prefiero no|ninguna|ninguno|nada|saltar|omitir)\b/.test(t);

function itemsLines(items){
  return Object.entries(items).map(([id,q])=>{ const p=prod(id); return `• ${q} × ${p.name} — ${money(p.price*q)}`; }).join('\n');
}
function itemsTotal(items){ return Object.entries(items).reduce((a,[id,q])=>a+prod(id).price*q,0); }
function dateButtons(){
  const sat = (6-today0().getDay()+7)%7 || 7;
  const b=['Mañana','Pasado mañana'];
  if(sat>2) b.push('Este sábado'); else b.push('El '+longDate(toISO(addDays(4))).split(' ').slice(1).join(' '));
  return b;
}
const TIME_BTNS = ['9–12 a. m.','12–3 p. m.','3–6 p. m.'];
function payButtons(d){ return ['Nequi','Transferencia Bancolombia','Daviplata', d.mode==='Domicilio'?'Efectivo contra entrega':'Efectivo al recoger']; }

function catalogText(){
  return S.catalog.filter(p=>p.avail).map(p=>`${p.emoji} *${p.name}* — ${money(p.price)}`).join('\n');
}

function greet(){
  return bot([
    {text:'¡Hola! 👋 ¿Cómo estás? Bienvenid@ a *Tina\'s Bakery* 🍰✨'},
    {text:'Te comparto nuestro catálogo 📖👇'},
    {type:'catalog'},
    {text:'Cuéntame, ¿qué te gustaría llevar? 😋\nToca *Ver catálogo* o escríbeme, por ejemplo: _1 torta choco crunch y 2 cajas de alfajores_'.replace(/_/g,'')}
  ]);
}
function acceptItems(items){
  const d=S.flow.draft;
  const unav = Object.keys(items).filter(id=>!prod(id).avail);
  unav.forEach(id=>delete items[id]);
  const msgs=[];
  if(unav.length) msgs.push({text:`Uy 😔 *${unav.map(id=>prod(id).name).join(', ')}* está agotado por ahora.`});
  if(!Object.keys(items).length){ msgs.push({text:'¿Te provoca algo más del catálogo? 🍪\n'+catalogText()}); S.flow.step='products'; save(); return bot(msgs); }
  for(const [id,q] of Object.entries(items)) d.items[id]=(d.items[id]||0)+q;
  S.flow.step='mode'; save();
  msgs.push({text:`¡Qué delicia! 😍 Te anoto:\n${itemsLines(d.items)}\n\nSubtotal: *${money(itemsTotal(d.items))}*`});
  msgs.push({text:'¿Lo quieres a domicilio 🛵 o pasas a recogerlo 🏠?', buttons:['🛵 Domicilio','🏠 Recogida']});
  return bot(msgs);
}
function summaryText(d){
  const lines=[`*Resumen de tu pedido* 🧾`, itemsLines(d.items), `Total: *${money(itemsTotal(d.items))}*`, '',
    `📅 Entrega: ${d.date?longDate(d.date):esc(d.dateText)}${d.time?' · '+d.time:''}`,
    d.mode==='Domicilio'?`🛵 Domicilio: ${d.address}`:'🏠 Recogida en Tina\'s Bakery',
    `👤 ${d.name} · ${CLIENT_PHONE}`, `💳 Pago: ${d.pay}`];
  if(d.notes) lines.push(`📝 Nota: ${d.notes}`);
  if(d.bday) lines.push(`🎂 Cumpleaños: ${d.bday}${d.promo?' (acepta promociones)':''}`);
  return lines.join('\n');
}

async function handle(raw){
  const t = norm(raw);
  const F = S.flow, d = F.draft;
  if(/^(reiniciar|empezar de nuevo|cancelar pedido|✏️ empezar de nuevo)/.test(t) || t.includes('empezar de nuevo')){
    F.step='products'; F.draft=newDraft(); save();
    return bot([{text:'¡Listo! Empezamos de nuevo 🔄 ¿Qué te gustaría llevar?'},{type:'catalog'}]);
  }
  if(/\b(catalogo|menu|carta|productos|precios)\b/.test(t) && ['idle','products','done','mode'].includes(F.step) && !Object.keys(parseItems(t)).length){
    if(F.step==='idle'||F.step==='done'){ F.step='products'; F.draft=newDraft(); save(); }
    return bot([{text:'¡Claro! Aquí está nuestro catálogo 📖'},{type:'catalog'},{text:'¿Qué te gustaría llevar? 😊'}]);
  }
  switch(F.step){
    case 'idle': case 'done': {
      const items=parseItems(t);
      if(F.step==='done' && !Object.keys(items).length && !/hola|buen|pedido|otro|quiero|comprar/.test(t)){
        return bot([{text:`Tu pedido *${S.lastOrder}* sigue en revisión ⏳ Martina o Sara te escriben por aquí apenas lo confirmen 💛\n¿Quieres hacer otro pedido? Escribe *catálogo* 😊`}]);
      }
      F.draft=newDraft(); F.step='products'; save();
      if(Object.keys(items).length){ await bot([{text:'¡Hola! 👋 Gracias por escribirle a *Tina\'s Bakery* 🍰'}]); return acceptItems(items); }
      return greet();
    }
    case 'products': {
      const items=parseItems(t);
      if(!Object.keys(items).length) return bot([{text:'Mmm 🤔 no logré identificar el producto. Esto es lo que tenemos hoy:\n'+catalogText()+'\n\nEscríbeme qué quieres y cuántos 😊'}]);
      return acceptItems(items);
    }
    case 'mode': {
      if(/domic|envi|casa|llev|traig|delivery|🛵/.test(t)){ d.mode='Domicilio'; F.step='address'; save(); return bot([{text:'¡Perfecto! 🛵 ¿A qué dirección te lo enviamos? Incluye barrio y alguna referencia 🏡'}]); }
      if(/recog|recoger|paso|punto|tienda|voy|🏠/.test(t)){ d.mode='Recogida'; F.step='date'; save(); return bot([{text:'¡Genial! 🏠 Te esperamos en Tina\'s Bakery. Al confirmar te enviamos la ubicación 📍'},{text:'¿Para qué día lo necesitas? 📅', buttons:dateButtons()}]); }
      const items=parseItems(t); if(Object.keys(items).length) return acceptItems(items);
      return bot([{text:'¿Lo prefieres a domicilio o pasas a recogerlo? 😊', buttons:['🛵 Domicilio','🏠 Recogida']}]);
    }
    case 'address': {
      if(raw.trim().length<6) return bot([{text:'¿Me compartes la dirección completa, por favor? 🙏 (ej. Calle 10 #32-15, El Poblado)'}]);
      d.address=raw.trim(); F.step='date'; save();
      return bot([{text:'¡Anotado! 📍'},{text:'¿Para qué día lo necesitas? 📅', buttons:dateButtons()}]);
    }
    case 'date': {
      const dt=parseDate(t);
      if(dt && dt<today0()) return bot([{text:'Esa fecha ya pasó 😅 ¿Para qué día lo necesitas?', buttons:dateButtons()}]);
      if(dt && toISO(dt)===toISO(today0())) return bot([{text:'Para hoy ya no alcanzamos a hornearlo con amor 🥺 Necesitamos al menos un día. ¿Te sirve otra fecha?', buttons:dateButtons()}]);
      if(dt){ d.date=toISO(dt); d.dateText=''; } else { d.date=null; d.dateText=raw.trim(); }
      F.step='time'; save();
      return bot([{text:`${dt?'¡Listo, para el *'+longDate(d.date)+'*! 🗓️':'¡Anotado! 🗓️'}\n¿En qué horario te queda mejor?`, buttons:TIME_BTNS}]);
    }
    case 'time': {
      d.time=raw.trim(); F.step='name'; save();
      return bot([{text:'Perfecto ⏰ ¿A nombre de quién registro el pedido? 😊'}]);
    }
    case 'name': {
      if(raw.trim().length<2) return bot([{text:'¿Me dices tu nombre completo, porfa? 😊'}]);
      d.name=cap(raw.trim().replace(/^(soy|me llamo|mi nombre es|a nombre de)\s+/i,'')); S.clientName=d.name; F.step='pay'; save();
      return bot([{text:`¡Mucho gusto, ${d.name.split(' ')[0]}! 💛`},{text:'¿Qué método de pago prefieres? 💳', buttons:payButtons(d)}]);
    }
    case 'pay': {
      let p=null;
      if(/nequi/.test(t)) p='Nequi'; else if(/bancol|transf/.test(t)) p='Transferencia Bancolombia'; else if(/davi/.test(t)) p='Daviplata'; else if(/efectivo|cash|contra/.test(t)) p = d.mode==='Domicilio'?'Efectivo contra entrega':'Efectivo al recoger';
      if(!p) return bot([{text:'¿Con cuál de estos métodos pagas? 💳', buttons:payButtons(d)}]);
      d.pay=p; F.step='notes'; save();
      return bot([{text:`¡Listo, ${p}! ✅ El pago lo coordinamos por aquí cuando confirmemos tu pedido.`},{text:'¿Alguna indicación especial? ✍️ (mensaje en la torta, alergias, hora exacta…)', buttons:['No, ninguna']}]);
    }
    case 'notes': {
      d.notes = isNo(t) ? '' : raw.trim(); F.step='auth'; save();
      return bot([{text:'Para registrar tu pedido necesito tu autorización para el tratamiento de tus datos personales 🔒 Solo los usamos para gestionar tus pedidos.', buttons:['✅ Sí, autorizo','No autorizo']}]);
    }
    case 'auth': {
      if(/no autorizo|^no\b/.test(t)) return bot([{text:'Entiendo 🙏 Sin esa autorización no puedo registrar el pedido. Si cambias de opinión, toca *Sí, autorizo*.', buttons:['✅ Sí, autorizo','No autorizo']}]);
      if(!isYes(t)) return bot([{text:'¿Nos autorizas el uso de tus datos para gestionar el pedido? 🔒', buttons:['✅ Sí, autorizo','No autorizo']}]);
      d.auth=true; F.step='bday'; save();
      return bot([{text:'¡Gracias! 💛\n🎂 *Opcional:* ¿nos compartes tu fecha de cumpleaños? Nos encanta consentir a nuestros clientes ese día. (ej. 14/03)', buttons:['Prefiero no']}]);
    }
    case 'bday': {
      if(isNo(t)){ d.bday=''; d.promo=false; F.step='confirm'; save(); return askConfirm(); }
      const b=parseBday(t);
      if(!b) return bot([{text:'No entendí bien la fecha 🙈 Escríbela así: 14/03, o toca *Prefiero no*.', buttons:['Prefiero no']}]);
      d.bday=b.txt; d.bdayMD=b.md; F.step='promo'; save();
      return bot([{text:`¡${b.txt}! 🥳 Lo tendremos presente.`},{text:'¿Te gustaría recibir mensajes de cumpleaños y promociones por este chat? 🎁', buttons:['Sí, quiero','No, gracias']}]);
    }
    case 'promo': {
      d.promo = isYes(t) || /quiero/.test(t); F.step='confirm'; save();
      return askConfirm();
    }
    case 'confirm': {
      if(/enviar|confirm|^si|correcto|listo|dale|✅/.test(t)) return finishOrder();
      return bot([{text:'¿Envío tu solicitud así? 😊', buttons:['✅ Enviar pedido','✏️ Empezar de nuevo']}]);
    }
  }
}
function askConfirm(){
  return bot([{text:summaryText(S.flow.draft)},{text:'¿Está todo bien? Si me confirmas, envío tu solicitud a Martina y Sara 👩‍🍳', buttons:['✅ Enviar pedido','✏️ Empezar de nuevo']}]);
}
function finishOrder(){
  const d=S.flow.draft;
  S.seq++; const code='TB-'+String(S.seq).padStart(4,'0');
  const items=Object.entries(d.items).map(([id,q])=>{const p=prod(id); return {id, name:p.name, cat:p.cat, qty:q, price:p.price};});
  const order={code, created:new Date().toISOString(), name:d.name, phone:CLIENT_PHONE, items, total:items.reduce((a,b)=>a+b.qty*b.price,0),
    date:d.date, dateText:d.dateText, time:d.time, mode:d.mode, address:d.address, notes:d.notes, bday:d.bday, bdayMD:d.bdayMD, promo:d.promo, auth:d.auth,
    pay:d.pay, payStatus:'Pendiente', status:'Pendiente de revisión', source:'chat'};
  S.orders.unshift(order); S.lastOrder=code; S.freshCode=code; S.flow.step='done'; S.flow.draft=newDraft();
  if(!S.logged || S.ptab!=='orders') S.unreadAdmin++;
  save(); renderAdmin(); panelToast(`🔔 Nuevo pedido ${code} · ${order.name} · ${money(order.total)}`);
  return bot([{text:`¡Listo! 🎉 Tu solicitud fue recibida con el código *${code}*.\n\n⏳ Está *pendiente de confirmación*: Martina o Sara la revisan y te confirman por aquí muy pronto. El pago se coordina al confirmar 💛`},{text:'¡Gracias por elegir Tina\'s Bakery! 🍰✨'}]);
}

let sheetQty={};
function openSheet(){
  sheetQty={};
  const scr=PH.client.el; const old=$('.sheet-wrap',scr); if(old) old.remove();
  const w=document.createElement('div'); w.className='sheet-wrap';
  const groups=[...new Set(S.catalog.map(p=>p.cat))];
  w.innerHTML=`<div class="sheet" role="dialog" aria-label="Catálogo">
    <div class="sheet-head"><b>Catálogo Tina's Bakery</b><button class="icon-btn" type="button" data-x aria-label="Cerrar">${I.close}</button></div>
    <div class="sheet-body">${groups.map(g=>`<div class="cat-group">${esc(g)}</div>`+S.catalog.filter(p=>p.cat===g).map(p=>`
      <div class="prod ${p.avail?'':'off'}"><div class="thumb" style="background:${p.hue}">${p.emoji}</div>
        <div class="prod-info"><b>${esc(p.name)}</b><p>${esc(p.desc)}</p><span class="price">${p.avail?money(p.price):'Agotado'}</span></div>
        ${p.avail?`<div class="stepper"><button type="button" data-dec="${p.id}" aria-label="Quitar">−</button><output data-q="${p.id}">0</output><button type="button" data-inc="${p.id}" aria-label="Agregar">+</button></div>`:''}
      </div>`).join('')).join('')}</div>
    <div class="sheet-foot"><button class="btn primary" type="button" data-add disabled>Selecciona productos</button></div></div>`;
  scr.appendChild(w);
  const upd=()=>{ let n=0,tot=0; for(const [id,q] of Object.entries(sheetQty)){ n+=q; tot+=q*prod(id).price; const o=$(`[data-q="${id}"]`,w); if(o) o.textContent=q; }
    S.catalog.forEach(p=>{ const o=$(`[data-q="${p.id}"]`,w); if(o) o.textContent=sheetQty[p.id]||0; });
    const b=$('[data-add]',w); b.disabled=!n; b.textContent = n?`Enviar pedido (${n}) · ${money(tot)}`:'Selecciona productos'; };
  w.addEventListener('click',e=>{
    if(e.target===w || e.target.closest('[data-x]')){ w.remove(); return; }
    const inc=e.target.closest('[data-inc]'), dec=e.target.closest('[data-dec]');
    if(inc){ const id=inc.dataset.inc; sheetQty[id]=(sheetQty[id]||0)+1; upd(); }
    if(dec){ const id=dec.dataset.dec; sheetQty[id]=Math.max(0,(sheetQty[id]||0)-1); if(!sheetQty[id]) delete sheetQty[id]; upd(); }
    if(e.target.closest('[data-add]')){
      const txt='Quiero pedir: '+Object.entries(sheetQty).map(([id,q])=>`${q} × ${prod(id).name}`).join(', ');
      w.remove(); clientSend(txt);
    }
  });
}

    <div class="p-body" id="p-body"></div>`;
  panel.querySelectorAll('[data-ptab]').forEach(b=>b.addEventListener('click',()=>{ S.ptab=b.dataset.ptab; save(); renderAdmin(); }));
  $('[data-logout]',panel).addEventListener('click',()=>{ S.logged=false; save(); renderAdmin(); });
  const body=$('#p-body');
  if(S.ptab==='orders') renderOrders(body);
  else if(S.ptab==='prod') renderProd(body);
  else if(S.ptab==='clients') renderClients(body);
  else renderCatalog(body);
  if(openCode) renderDrawer();
  if(S.ptab==='orders'){ S.unreadAdmin=0; save(); renderTabs(); }
}
function renderOrders(body){
  const counts={}; STATUSES.forEach(s=>counts[s]=0); S.orders.forEach(o=>counts[o.status]++);
  const q=norm(S.search);
  const list=S.orders.filter(o=>(S.filter==='all'||o.status===S.filter) && (!q || norm(o.name).includes(q) || norm(o.code).includes(q)));
  body.innerHTML=`
    <div class="stats">
      <button type="button" class="stat" data-f="all" aria-pressed="${S.filter==='all'}"><span class="n">${S.orders.length}</span><span class="l">Todos</span></button>
      ${STATUSES.map(s=>`<button type="button" class="stat" data-f="${esc(s)}" aria-pressed="${S.filter===s}"><span class="n" style="color:var(--${{'s-pend':'warn','s-conf':'info','s-prep':'prep','s-ready':'ready','s-done':'ok','s-rej':'bad'}[SCLS[s]]})">${counts[s]}</span><span class="l">${esc(s.replace(' o cancelado','').replace(' de revisión',''))}</span></button>`).join('')}
    </div>
    <div class="toolbar"><input id="o-search" type="search" placeholder="Buscar por nombre del cliente o código (TB-0005)" value="${esc(S.search)}"><span class="count">${list.length} pedido${list.length===1?'':'s'}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Código</th><th>Cliente</th><th>Productos</th><th>Entrega</th><th>Modalidad</th><th>Total</th><th>Pago</th><th>Estado</th></tr></thead>
      <tbody>${list.length?list.map(o=>`<tr data-code="${o.code}" class="${S.freshCode===o.code?'fresh':''}">
        <td class="code">${o.code}${o.example?'<span class="ex">ejemplo</span>':''}${S.freshCode===o.code?'<span class="newtag">nuevo</span>':''}<div class="muted">${new Date(o.created).toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</div></td>
        <td><b>${esc(o.name)}</b><div class="muted">${esc(o.phone)}</div></td>
        <td>${esc(itemsShort(o))}</td><td>${deliv(o)}</td><td>${o.mode==='Domicilio'?'🛵 Domicilio':'🏠 Recogida'}</td>
        <td class="num">${money(o.total)}</td><td><span class="${o.payStatus==='Pagado'?'pay-ok':'pay-pend'}">${o.payStatus}</span><div class="muted">${esc(o.pay)}</div></td><td>${pill(o.status)}</td></tr>`).join('')
      :`<tr><td colspan="8" class="empty">No hay pedidos con ese filtro.</td></tr>`}</tbody></table></div>`;
  body.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{ S.filter=b.dataset.f; save(); renderAdmin(); }));
  const si=$('#o-search',body); si.addEventListener('input',()=>{ S.search=si.value; const pos=si.selectionStart; renderAdmin(); const n=$('#o-search'); n.focus(); n.setSelectionRange(pos,pos); });
  body.querySelectorAll('tbody tr[data-code]').forEach(tr=>tr.addEventListener('click',()=>{ openCode=tr.dataset.code; if(S.freshCode===openCode){ S.freshCode=null; save(); } renderAdmin(); }));
}
function renderDrawer(){
  const o=S.orders.find(x=>x.code===openCode); if(!o){ openCode=null; return; }
  const w=document.createElement('div'); w.className='drawer-wrap';
  w.innerHTML=`<aside class="drawer" role="dialog" aria-label="Detalle del pedido">
    <h3>${o.code} ${pill(o.status)}<button class="icon-btn" type="button" data-x aria-label="Cerrar" style="margin-left:auto">${I.close}</button></h3>
    ${o.example?'<div class="muted">Pedido de ejemplo precargado para la demostración.</div>':''}
    ${o.status==='Pendiente de revisión'?`<div class="actions"><button class="btn primary" type="button" data-quick="Confirmado">✅ Confirmar pedido</button><button class="btn danger" type="button" data-quick="Rechazado o cancelado">✕ Rechazar</button></div>`:''}
    <div class="box"><h5>Cliente</h5><dl class="dl">
      <dt>Nombre</dt><dd>${esc(o.name)}</dd><dt>Celular</dt><dd>${esc(o.phone)}</dd>
      <dt>Cumpleaños</dt><dd>${o.bday?esc(o.bday):'No lo compartió'}</dd>
      <dt>Promociones</dt><dd>${o.promo?'✅ Autoriza mensajes':'No autoriza'}</dd>
      <dt>Datos personales</dt><dd>${o.auth?'✅ Autorizado':'—'}</dd></dl></div>
    <div class="box"><h5>Productos</h5><table class="items-t"><tbody>${o.items.map(i=>`<tr><td>${i.qty} × ${esc(i.name)}<div class="muted">${esc(i.cat)} · ${money(i.price)} c/u</div></td><td class="r">${money(i.qty*i.price)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="r">${money(o.total)}</td></tr></tfoot></table></div>
    <div class="box"><h5>Entrega</h5><dl class="dl">
      <dt>Fecha</dt><dd>${o.date?longDate(o.date):esc(o.dateText||'—')}</dd><dt>Horario</dt><dd>${esc(o.time||'—')}</dd>
      <dt>Modalidad</dt><dd>${esc(o.mode)}</dd>${o.mode==='Domicilio'?`<dt>Dirección</dt><dd>${esc(o.address)}</dd>`:''}
      <dt>Observaciones</dt><dd>${esc(o.notes||'Ninguna')}</dd><dt>Registrado</dt><dd>${new Date(o.created).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}</dd></dl></div>
    <div class="box"><h5>Seguimiento</h5>
      <div class="two"><div class="field"><label for="d-status">Estado</label><select id="d-status">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="d-pay">Pago (${esc(o.pay)})</label><select id="d-pay">${['Pendiente','Pagado'].map(s=>`<option ${s===o.payStatus?'selected':''}>${s}</option>`).join('')}</select></div></div>
      ${o.source==='chat'?'<label class="chk" style="margin-top:10px"><input type="checkbox" id="d-notify" checked> Avisar al cliente por chat al cambiar el estado</label>':''}
      <div class="actions" style="margin-top:12px"><button class="btn primary" type="button" data-save>Guardar cambios</button></div>
    </div></aside>`;
  panel.appendChild(w);
  w.addEventListener('click',e=>{
    if(e.target===w || e.target.closest('[data-x]')){ openCode=null; w.remove(); return; }
    const qk=e.target.closest('[data-quick]'); if(qk){ applyStatus(o, qk.dataset.quick, o.payStatus, o.source==='chat'); return; }
    if(e.target.closest('[data-save]')){ const n=$('#d-notify',w); applyStatus(o, $('#d-status',w).value, $('#d-pay',w).value, n?n.checked:false); }
  });
}
function applyStatus(o, status, pay, notify){
  const changed = status!==o.status;
  o.status=status; o.payStatus=pay; save();
  openCode=null; renderAdmin();
  panelToast(changed?`${o.code}: ${status}`:'Cambios guardados');
  if(changed && notify && o.source==='chat'){
    const first=o.name.split(' ')[0];
    const msg = {
      'Confirmado':`¡Hola ${first}! 🎉 Tu pedido *${o.code}* quedó *confirmado* para el ${o.date?longDate(o.date):o.dateText}${o.time?' ('+o.time+')':''}.\nTotal: *${money(o.total)}* · Pago por ${o.pay}. Ya te compartimos los datos para el pago 💛`,
      'En preparación':`👩‍🍳 ¡Ya estamos preparando tu pedido *${o.code}* con mucho amor!`,
      'Listo para entregar': o.mode==='Domicilio'?`🛵 ¡Tu pedido *${o.code}* está listo y sale pronto hacia ${o.address}!`:`🏠 ¡Tu pedido *${o.code}* está listo para recoger! Te esperamos 💛`,
      'Entregado':`¡Gracias por elegir Tina's Bakery, ${first}! 🍰 Esperamos que lo disfrutes muchísimo ✨`,
      'Rechazado o cancelado':`Hola ${first} 😔 Lamentablemente no podemos atender el pedido *${o.code}* para esa fecha. ¿Te sirve otro día? Con gusto te ayudamos.`,
      'Pendiente de revisión':`Tu pedido *${o.code}* está de nuevo en revisión ⏳`
    }[status];
    setTimeout(()=>{ pushMsg({from:'staff', staff:'Martina', text:msg}); if(S.clientView!=='chat') renderTabs(); }, 500);
  }
}
function renderProd(body){
  const active=S.orders.filter(o=>!['Rechazado o cancelado','Entregado'].includes(o.status));
  const groups={};
  active.forEach(o=>{ const k=o.date||'zz-'+(o.dateText||'sin fecha'); (groups[k]=groups[k]||[]).push(o); });
  const keys=Object.keys(groups).sort();
  body.innerHTML=`<p class="section-note">Pedidos por fecha de entrega (sin entregados ni rechazados). Cada día muestra cuántas unidades hay que preparar.</p>
    ${keys.length?`<div class="days">${keys.map(k=>{
      const os=groups[k].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const units={}; os.forEach(o=>o.items.forEach(i=>units[i.name]=(units[i.name]||0)+i.qty));
      const isToday = k===toISO(addDays(1)) ;
      return `<div class="day"><h4>${k.startsWith('zz-')?esc(k.slice(3)):cap(longDate(k))}<small>${os.length} pedido${os.length>1?'s':''}${isToday?' · mañana':''}</small></h4>
        <div class="units">${Object.entries(units).map(([n,q])=>`<div><span>${esc(n)}</span><b>${q}</b></div>`).join('')}</div>
        <ul>${os.map(o=>`<li data-code="${o.code}"><span><b class="lname">${esc(o.name)}</b> <span class="muted">${o.code} · ${esc(o.time||'')} · ${o.mode==='Domicilio'?'🛵':'🏠'}</span></span>${pill(o.status)}</li>`).join('')}</ul></div>`;
    }).join('')}</div>`:'<div class="empty">No hay pedidos activos por preparar.</div>'}`;
  body.querySelectorAll('li[data-code]').forEach(li=>li.addEventListener('click',()=>{ openCode=li.dataset.code; renderAdmin(); }));
}
function renderClients(body){
  const map={};
  S.orders.forEach(o=>{ const c=map[o.phone]=map[o.phone]||{name:o.name, phone:o.phone, n:0, spent:0, bday:'', md:null, promo:false, last:''};
    c.n++; if(o.status!=='Rechazado o cancelado') c.spent+=o.total; if(o.bday){ c.bday=o.bday; c.md=o.bdayMD; } if(o.promo) c.promo=true; if(!c.last||o.created>c.last) c.last=o.created; c.name=o.name; });
  const now=today0();
  const daysTo=md=>{ if(!md) return null; let d=new Date(now.getFullYear(),md[0]-1,md[1]); if(d<now) d.setFullYear(d.getFullYear()+1); return Math.round((d-now)/864e5); };
  const rows=Object.values(map).sort((a,b)=>(daysTo(a.md)??999)-(daysTo(b.md)??999));
  body.innerHTML=`<p class="section-note">Historial de clientes. Los cumpleaños solo se usan con quienes autorizaron recibir mensajes y promociones.</p>
    <div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Celular</th><th>Pedidos</th><th>Total comprado</th><th>Cumpleaños</th><th>Promociones</th></tr></thead>
    <tbody>${rows.map(c=>{ const dt=daysTo(c.md); return `<tr style="cursor:default"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td class="num">${c.n}</td><td class="num">${money(c.spent)}</td>
      <td>${c.bday?esc(c.bday):'<span class="muted">—</span>'}${c.bday&&c.promo&&dt<=30?` <span class="pill s-pend">🎂 en ${dt} día${dt===1?'':'s'}</span>`:''}</td>
      <td>${c.promo?'<span class="pay-ok">✅ Autoriza</span>':'<span class="muted">No autoriza</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function renderCatalog(body){
  body.innerHTML=`<p class="section-note">Edita precios, descripciones y disponibilidad. El agente usa estos datos en tiempo real cuando envía el catálogo.</p>
    <div class="cat-admin">${S.catalog.map(p=>`<div class="cat-row">
      <div class="thumb" style="background:${p.hue}">${p.emoji}</div>
      <div class="fields"><small>${esc(p.cat)}</small><b>${esc(p.name)}</b><textarea id="desc-${p.id}" data-desc="${p.id}" rows="2" aria-label="Descripción de ${esc(p.name)}">${esc(p.desc)}</textarea></div>
      <div class="field price-cell"><label for="price-${p.id}">Precio (COP)</label><input id="price-${p.id}" type="number" min="0" step="1000" value="${p.price}" data-price="${p.id}"></div>
      <div class="avail-cell"><button type="button" class="toggle" data-avail="${p.id}" aria-pressed="${p.avail}"><i></i>${p.avail?'Disponible':'Agotado'}</button></div>
    </div>`).join('')}</div>`;
  body.querySelectorAll('[data-price]').forEach(i=>i.addEventListener('change',()=>{ const p=prod(i.dataset.price); p.price=Math.max(0,parseInt(i.value,10)||0); save(); renderPhones(); panelToast(`Precio actualizado: ${p.name} ${money(p.price)}`); }));
  body.querySelectorAll('[data-desc]').forEach(i=>i.addEventListener('change',()=>{ prod(i.dataset.desc).desc=i.value; save(); }));
  body.querySelectorAll('[data-avail]').forEach(b=>b.addEventListener('click',()=>{ const p=prod(b.dataset.avail); p.avail=!p.avail; save(); renderAdmin(); renderPhones(); }));
}

/* ================= tabs (phone width) ================= */
let curTab='client';
function renderTabs(){
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===curTab));
  document.querySelectorAll('.station').forEach(s=>s.classList.toggle('active', s.dataset.station===curTab));
  const set=(id,n)=>{ const e=$('#'+id); e.hidden=!n; e.textContent=n; };
  set('dot-client', curTab==='client'?0:S.unreadClient);
  set('dot-biz', curTab==='biz'?0:S.unreadBiz);
  set('dot-admin', curTab==='admin'?0:S.unreadAdmin);
}
document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.addEventListener('click',()=>{ curTab=b.dataset.tab; renderTabs(); }));

function renderAll(){ renderPhones(); renderTabs(); }

/* ================= top actions ================= */
const resetBtn=$('#btn-reset'); let resetArm=null;
resetBtn.addEventListener('click',()=>{
  if(!resetArm){ resetBtn.textContent='¿Seguro? Toca otra vez'; resetArm=setTimeout(()=>{ resetArm=null; resetBtn.textContent='Reiniciar simulación'; },3000); return; }
  clearTimeout(resetArm); resetArm=null; resetBtn.textContent='Reiniciar simulación';
  try{ localStorage.removeItem(KEY); }catch(e){}
  queue=Promise.resolve(); S=freshState(); S.typing=false; mid=0; openCode=null; demoRunning=false;
  const sw=$('.sheet-wrap'); if(sw) sw.remove();
  renderAll(); renderAdmin();
});
let demoRunning=false;
$('#btn-demo').addEventListener('click',async()=>{
  if(demoRunning) return; demoRunning=true;
  if(S.flow.step!=='idle' && S.flow.step!=='done'){ S.flow.step='done'; S.flow.draft=newDraft(); }
  S.agentOn=true; S.clientView='chat'; S.bizView='chat'; S.unreadBiz=0; S.unreadClient=0; save(); renderAll();
  const sat = dateButtons()[1];
  const script=['Hola, buenas tardes 😊','Quiero 1 torta choco crunch y 2 cajas de alfajores','🛵 Domicilio','Calle 10 #32-15, apto 502, El Poblado',sat,'3–6 p. m.','Laura Gómez','Nequi','Que diga "Feliz cumpleaños Mami" 🎂','✅ Sí, autorizo','14/03','Sí, quiero','✅ Enviar pedido'];
  for(const line of script){
    if(!demoRunning) return;
    await queue; await sleep(900);
    if(!demoRunning) return;
    clientSend(line);
    await sleep(500); await queue;
  }
  demoRunning=false;
});

/* ================= boot ================= */
renderAll(); renderAdmin();
})();
</script>
</body>
</html>
